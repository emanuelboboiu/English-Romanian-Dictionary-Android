plugins {
    id 'com.android.application'
}

android {
    namespace = "ro.pontes.englishromaniandictionary"
    compileSdk = 36

    defaultConfig {
        applicationId = "ro.pontes.englishromaniandictionary"
        minSdk = 23
        targetSdk = 36
        versionCode = 93
        versionName = "8.3.3"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.txt'
        }
    }

    bundle {
        language {
            // Both languages are required for the in-app language switcher.
            enableSplit = false
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'androidx.activity:activity:1.12.2'
    implementation 'androidx.annotation:annotation:1.11.0'
}
